name: Website checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:consent
      - run: npm run test:consent-incomplete
      - run: npm run test:lighthouse
      - run: npm run package:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            reports/
            playwright-report/
            test-results/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bookme-static-site
          path: artifacts/bookme-website.tar.gz
          if-no-files-found: error
          retention-days: 14
